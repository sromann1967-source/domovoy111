<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет соединения — Домовой</title>
    <style>
        /* Все стили встроены прямо в файл, чтобы они гарантированно загрузились */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: 'Inter', Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .offline-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 {
            font-family: 'Oswald', Arial, sans-serif;
            font-size: 28px;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: 1px;
        }
        p {
            color: #aaaaaa;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .btn-phone {
            background-color: #FF8C42;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 140, 66, 0.3);
        }
        .btn-phone:hover { background-color: #E5762E; }
        .btn-tg {
            background-color: #1E5B8C;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(30, 91, 140, 0.3);
        }
        .btn-tg:hover { background-color: #15456B; }
        .footer-text {
            font-size: 12px;
            color: #666;
            margin-top: 20px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <h1>Нет соединения</h1>
        <p>Похоже, у вас пропал интернет или наш сайт временно недоступен. Но мы на связи!</p>
        
        <a href="tel:+79204208262" class="btn btn-phone">📞 Позвонить нам</a>
        <a href="https://t.me/pra_dead" class="btn btn-tg">✈️ Написать в Telegram</a>
        
        <p class="footer-text">Ежедневно с 09:00 до 18:00</p>
    </div>
</body>
</html>
